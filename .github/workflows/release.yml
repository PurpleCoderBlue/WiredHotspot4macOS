name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test universal binary
        run: |
          make test
          make clean
          make ARCH_FLAGS="-arch arm64 -arch x86_64" STATUS_ARCHS="arm64 x86_64" VERSION="${GITHUB_REF_NAME#v}"
          lipo -archs build/horndis | grep -q arm64
          lipo -archs build/horndis | grep -q x86_64
          lipo -archs build/horndis-status | grep -q arm64
          lipo -archs build/horndis-status | grep -q x86_64
          codesign --force --sign - build/horndis
          codesign --force --deep --sign - build/HoRNDISStatus.app
          file build/horndis
          file build/horndis-status
      - name: Package
        run: |
          mkdir -p dist/horndis
          cp build/horndis README.md README.zh-CN.md README.en.md LICENSE dist/horndis/
          cp -R -X build/HoRNDISStatus.app dist/horndis/
          cp -R Documentation dist/horndis/
          cp -R docs dist/horndis/
          ditto -c -k --keepParent dist/horndis "dist/WiredHotspot4macOS-${GITHUB_REF_NAME}-macos-universal.zip"

          Scripts/build-package "${GITHUB_REF_NAME#v}" \
            "dist/WiredHotspot4macOS-${GITHUB_REF_NAME}-macos-universal.pkg"
          ! pkgutil --payload-files \
            "dist/WiredHotspot4macOS-${GITHUB_REF_NAME}-macos-universal.pkg" \
            | grep -Eq '(^|/)\._'

          python3 Tests/PackageContentsTests.py "dist/WiredHotspot4macOS-${GITHUB_REF_NAME}-macos-universal.pkg"
          (
            cd dist
            shasum -a 256 *.pkg *.zip > SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A maintainer may have already uploaded a locally verified build.
          # Preserve that release and its checksums rather than replacing assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded assets."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/*.zip dist/SHA256SUMS --generate-notes
          fi
